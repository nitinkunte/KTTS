[project]
name = "ktts"
version = "0.1.0"
description = "A pause-and-resume Kokoro text-to-speech CLI and library"
readme = "README.md"
authors = [
    { name = "Nitin Kunte", email = "nitin_kunte@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles==23.2.1",
    "av>=14.2.0",
    "en-core-web-sm",
    "espeakng-loader==0.2.4",
    "huggingface-hub>=0.34.0",
    "inflect>=7.5.0",
    "kokoro==0.9.4",
    "loguru==0.7.3",
    "misaki[en]==0.9.4",
    "numpy>=1.26.0",
    "phonemizer-fork>=3.3.2",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.2.2",
    "regex>=2025.10.22",
    "soundfile==0.13.0",
    "text2num>=2.5.1",
    "torch==2.8.0",
    "transformers>=5.5.0,<6",
    "unicode-segmentation-rs>=0.3.3",
]

[project.scripts]
ktts = "ktts.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
markers = ["integration: requires downloaded Kokoro model and voice assets"]
